name: Apply v1.2 intro and response revision

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-v1-2
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply verified revision
        shell: bash
        run: |
          set -euo pipefail
          tr -d '\n\r' < updates/coc-v1.2.patch.b64 | base64 --decode > /tmp/coc-v1.2.patch.gz
          printf '%s  %s\n' '4b961b3bc73ed021c7d81406d66f95573a021d91abb67d7da6c1050a2e76ba7c' '/tmp/coc-v1.2.patch.gz' | sha256sum -c -
          gzip -dc /tmp/coc-v1.2.patch.gz > /tmp/coc-v1.2.patch
          git apply --check /tmp/coc-v1.2.patch
          git apply /tmp/coc-v1.2.patch
          rm -rf updates
          rm -f .github/workflows/apply-v1.2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Clarify opening and remove allocation responses"
          git push origin HEAD:main
