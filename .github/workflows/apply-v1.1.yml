name: Apply v1.1 scene revision

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-v1.1
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply verified revision
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f .upgrade/v1.1.part00 ]]; then
            echo "v1.1 revision has already been expanded."
            exit 0
          fi
          cat \
            .upgrade/v1.1.part00 \
            .upgrade/v1.1.part01 \
            .upgrade/v1.1.part02 \
            .upgrade/v1.1.part03 \
            | base64 --decode > /tmp/coc-v1.1.patch.gz
          echo "ae520466575b4d051e6c65811ed4e8183564084c088dcf3e32754303abdcc684  /tmp/coc-v1.1.patch.gz" | sha256sum -c -
          gzip -dc /tmp/coc-v1.1.patch.gz > /tmp/coc-v1.1.patch
          git apply --check /tmp/coc-v1.1.patch
          git apply /tmp/coc-v1.1.patch
          rm -rf .upgrade updates
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Revise scene questions and response interfaces"
          git push origin HEAD:main
