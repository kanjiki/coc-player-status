name: Apply v1.6 information order

on:
  push:
    branches: [main]
    paths:
      - "scripts/apply-v1.6.py"
      - ".github/workflows/apply-v1.6-information-order.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-v1-6-information-order
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply information-order revision
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply-v1.6.py
          python - <<'PY'
          from pathlib import Path
          p = Path('src/core/sceneGuides.ts')
          s = p.read_text(encoding='utf-8')
          old = 'objective: "地下の旧実験区画へ進む経路を選ぶ。"'
          new = 'objective: "地下の旧実験区画へ向かうため、危険度と所要時間の異なる経路から進み方を選ぶ。"'
          if old not in s:
              raise SystemExit('L03 objective marker not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate
        run: npm run check

      - name: Commit revision
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/apply-v1.6.py
          rm -f .github/workflows/apply-v1.6-information-order.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Revise information disclosure order"
          git push origin HEAD:main
