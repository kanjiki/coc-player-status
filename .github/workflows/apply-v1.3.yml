name: Apply v1.3 KP read-aloud revision

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-v1-3
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply UI revision and validate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/app.ts')
          text = path.read_text(encoding='utf-8')

          old_import = 'import { SCENE_GUIDES } from "./core/sceneGuides.js";'
          new_import = old_import + '\nimport { READ_ALOUD_TEXT } from "./core/readAloud.js";'
          if new_import not in text:
              if old_import not in text:
                  raise SystemExit('scene guide import not found')
              text = text.replace(old_import, new_import, 1)

          start = text.index('function sceneGuideMarkup(scene: ResolvedScene): string {')
          end = text.index('function hashNumber(value: string): number {', start)
          replacement = '''function readAloudMarkup(scene: ResolvedScene): string {
            const text = READ_ALOUD_TEXT[scene.slotId] ?? scene.body;
            const paragraphs = text.split(/\\n\\s*\\n/).map((paragraph) => paragraph.trim()).filter(Boolean);
            return `<div class="read-aloud-copy">${paragraphs.map((paragraph) => `<p class="scene-body">${escapeHtml(paragraph)}</p>`).join("")}</div>`;
          }

          function sceneGuideMarkup(scene: ResolvedScene): string {
            const guide = SCENE_GUIDES[scene.slotId];
            return `
              <section class="scene-guide" aria-label="確認できること">
                <div class="scene-guide-grid">
                  <div>
                    <h2>確認できること</h2>
                    <ul>${guide.knownFacts.map((fact) => `<li>${escapeHtml(fact)}</li>`).join("")}</ul>
                  </div>
                </div>
                ${guide.glossary?.length ? `
                  <details class="scene-glossary">
                    <summary>用語の補足</summary>
                    ${guide.glossary.map((item) => `<p><strong>${escapeHtml(item.term)}</strong>：${escapeHtml(item.definition)}</p>`).join("")}
                  </details>` : ""}
              </section>`;
          }

          '''
          text = text[:start] + replacement + text[end:]

          old_body = '            <p class="scene-body">${escapeHtml(scene.body)}</p>'
          if old_body not in text:
              raise SystemExit('scene body line not found')
          text = text.replace(old_body, '            ${readAloudMarkup(scene)}', 1)

          lines = []
          inserted_decision = False
          for line in text.splitlines():
              if '${scene.constraint ? `<p class="scene-constraint"' in line:
                  continue
              if '<p class="answer-principle">' in line:
                  continue
              lines.append(line)
              if '${sceneGuideMarkup(scene)}' in line and not inserted_decision:
                  lines.append('            <h2 class="decision-heading">どうする？</h2>')
                  inserted_decision = True
          if not inserted_decision:
              raise SystemExit('decision heading insertion point not found')
          text = '\n'.join(lines) + '\n'
          path.write_text(text, encoding='utf-8')

          for file_name in ['package.json', 'public/site-config.js']:
              p = Path(file_name)
              s = p.read_text(encoding='utf-8')
              s2 = s.replace('1.2.0-beta.1', '1.3.0-beta.1')
              if s2 == s:
                  raise SystemExit(f'version marker missing in {file_name}')
              p.write_text(s2, encoding='utf-8')

          report = Path('reports/revision-v1.3.md')
          report.write_text('''# KP読み上げ本文統一 v1.3\n\n- 24 SceneすべてにKPがそのまま読める本文を追加。\n- PCの感情・内心は指定せず、観測可能な事実、NPCの発言、公開情報のみで構成。\n- Scene画面から「今回の目的」「この判断で変わること」「判断：」「制約：」の診断票的表示を除去。\n- 読み上げ後には「確認できること」と必要な用語補足だけを表示。\n- 回答直前の見出しを「どうする？」へ統一。\n- 採点、状態遷移、選択肢、Ending A〜Gには変更なし。\n- スライダー等の回答UIも既存の意味があるSceneだけを維持。\n''', encoding='utf-8')
          PY

          npm install --no-audit --no-fund
          npm run check

          rm -f .github/workflows/apply-v1.3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unify all scenes as KP read-aloud text"
          git push origin HEAD:main
