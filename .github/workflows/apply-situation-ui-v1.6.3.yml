name: Apply situation UI v1.6.3

on:
  push:
    branches: [main]
    paths:
      - "scripts/apply-situation-ui-v1.6.3.py"
      - ".github/workflows/apply-situation-ui-v1.6.3.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/apply-situation-ui-v1.6.3.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate
        run: npm run check
      - name: Commit revision
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/apply-situation-ui-v1.6.3.py
          rm -f .github/workflows/apply-situation-ui-v1.6.3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make situation panel self-explanatory"
          git push origin HEAD:main
